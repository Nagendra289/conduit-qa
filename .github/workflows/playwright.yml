name: Playwright tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run catches drift in the shared demo environment (data, deploys)
    # even when nobody pushed. 01:30 UTC = 07:00 IST.
    - cron: '30 1 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      BASE_URL: ${{ vars.BASE_URL || 'https://conduit.bondaracademy.com' }}
      API_URL: ${{ vars.API_URL || 'https://conduit-api.bondaracademy.com/api' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # One invocation for both projects (api + e2e) so they land in a single
      # HTML report; the report groups results by project.
      - name: Run tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7
